description: |
  Ibn Qulawayh's collection of traditions on the rewards and rituals of
  Ziyarah, visiting the tombs of the Prophet (s), the Imams (a) and the
  believers. It covers the merits and methods of Ziyarah, from invoking
  blessings to bidding farewell, with particular focus on visiting Imam
  Husayn (a). Translated from the Arabic as Kamil Az-Ziyarah.
